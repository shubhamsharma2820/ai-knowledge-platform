services:
  postgres:
    image: postgres:13
    container_name: ai-knowledge-platform-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ai-knowledge-platform
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
